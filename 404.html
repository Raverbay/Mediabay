/* V18 — AD010-inspired editorial architecture, MediaBay identity */
:root{

 --ink:#111510;
 --cream:#eee5d3;
 --forest:#153320;
}
body{background:var(--cream);color:var(--ink)}

 border:0;mix-blend-mode:multiply;

.hero{

 overflow:hidden;

}
.hero h1{

 font-size:clamp(78px,14.2vw,225px)!important;
 line-height:.73!important;
 letter-spacing:-.095em!important;

 color:var(--ink)!important;
}
.hero h1 span{

 color:transparent!important;
 -webkit-text-stroke:2px var(--ink);
}
.hero-bottomline p{margin:0;line-height:1.5}
.hero-bottomline a{

.hero-corner-b{left:4.5vw;top:50%;writing-mode:vertical-rl;transform:rotate(180deg)}

/* V19 — AD010-inspired minimal loading screen */
#preloader{
 position:fixed;inset:0;z-index:99999;
 background:#c8ff32;color:#101510;
 display:flex;flex-direction:column;justify-content:space-between;
 padding:28px 4.5vw 30px;
 opacity:1;visibility:visible;
 transition:transform .9s cubic-bezier(.77,0,.18,1),opacity .35s ease;
 overflow:hidden;
}
#preloader:before{
 content:"";position:absolute;left:0;right:0;top:50%;
 border-top:1px solid rgba(16,21,16,.2);
}
#preloader.done{
 opacity:0;visibility:hidden;pointer-events:none;
 transform:translateY(-100%);
}
.ad-loader-top,.ad-loader-bottom{
 position:relative;z-index:2;
 display:flex;justify-content:space-between;
 font-size:9px;letter-spacing:.18em;
 text-transform:uppercase;font-weight:700;
}
.ad-loader-center{
 position:absolute;left:4.5vw;right:4.5vw;top:50%;
 transform:translateY(-50%);
 z-index:2;
}
.ad-loader-percent{
 font-size:clamp(130px,25vw,380px);
 font-weight:900;
 line-height:.68;
 letter-spacing:-.11em;
 display:flex;align-items:flex-end;
}
.ad-loader-percent small{
 font-size:.18em;
 letter-spacing:-.03em;
 margin:0 0 .08em .18em;
}
.ad-loader-rule{
 height:2px;background:rgba(16,21,16,.2);
 margin-top:40px;
 overflow:hidden;
}
.ad-loader-rule i{
 display:block;width:0;height:100%;
 background:#101510;
 transition:width .08s linear;
}
.ad-loader-bottom{opacity:.7}
@media(max-width:700px){
 #preloader{padding:22px 18px 24px}
 .ad-loader-top,.ad-loader-bottom{font-size:7px}
 .ad-loader-center{left:18px;right:18px}
 .ad-loader-percent{
   font-size:clamp(108px,31vw,190px);
   letter-spacing:-.1em;
 }
 .ad-loader-rule{margin-top:28px}
}

  position:relative;
  height:190px;
  overflow:hidden;
  border:1px solid currentColor;
  display:grid;
  place-items:center;
  transition:transform .65s cubic-bezier(.2,.8,.2,1);
}
.work-item:hover .work-visual{transform:scale(.97)}
.work-visual span{
  position:relative;
  z-index:2;
  font-size:clamp(22px,3vw,46px);
  line-height:.78;
  letter-spacing:-.07em;
  font-weight:900;
}
.visual-engine{
  background:
    radial-gradient(circle at 50% 50%,transparent 0 22%,rgba(241,231,210,.7) 22.2% 22.5%,transparent 22.8% 35%,rgba(241,231,210,.35) 35.2% 35.5%,transparent 35.8%),
    var(--forest);
  color:var(--cream);
}
.visual-engine:before,.visual-engine:after{
  content:"";
  position:absolute;
  inset:15%;
  border:1px solid currentColor;
  transform:rotate(45deg);
  opacity:.25;
}
.visual-engine:after{inset:29%;transform:rotate(0);border-radius:50%}
.visual-revelle{
  background:var(--mb-green);
  color:var(--ink);
}
.visual-revelle:before{
  content:"";
  position:absolute;
  width:75%;
  height:1px;
  background:currentColor;
  transform:rotate(-34deg);
  box-shadow:0 42px 0 currentColor,0 -42px 0 currentColor;
  opacity:.28;
}
.visual-revelle:after{
  content:"R";
  position:absolute;
  font-size:180px;
  line-height:1;
  font-weight:900;
  letter-spacing:-.12em;
  opacity:.12;
}
.visual-mobility{
  background:var(--acid);
  color:var(--ink);
}
.visual-mobility:before{
  content:"";
  position:absolute;
  width:140%;
  height:1px;
  background:currentColor;
  transform:rotate(-12deg);
  box-shadow:0 38px 0 currentColor,0 -38px 0 currentColor;
  opacity:.22;
}
.visual-mobility:after{
  content:"↗";
  position:absolute;
  font-size:150px;
  right:-10px;
  bottom:-45px;
  font-weight:900;
  opacity:.1;
}
.work-arrow{
  width:46px;
  height:46px;
  border:1px solid currentColor;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:18px;

}
.work-item:hover .work-arrow{
  transform:translate(5px,-5px) rotate(0);
  background:var(--acid);
  color:var(--ink);
}
.work-foot{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
  font-size:8px;
  letter-spacing:.17em;
  text-transform:uppercase;

<script id="mediabay-v68-cinematic-engine">
(function(){
  'use strict';
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const sections=[...document.querySelectorAll('main>section')];
  if(!sections.length) return;
  let ticking=false;
  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
  function render(){
    ticking=false;
    const vh=Math.max(1,innerHeight);
    sections.forEach((s)=>{
      const r=s.getBoundingClientRect();
      if(r.bottom < -vh*0.35 || r.top > vh*1.35){
        s.style.setProperty('--mb68-shift','0px');
        s.style.setProperty('--mb68-scale','1');
        s.style.setProperty('--mb68-opacity','1');
        return;
      }
      /* 0 = just entering from below, 0.5 = centered, 1 = leaving above. */
      const p=clamp((vh-r.top)/(vh+r.height),0,1);
      const centered=1-Math.min(1,Math.abs(p-.5)*2);
      const shift=((.5-p)*42);
      const scale=.985+(centered*.015);
      const opacity=.76+(centered*.24);
      s.style.setProperty('--mb68-shift',shift.toFixed(2)+'px');
      s.style.setProperty('--mb68-scale',scale.toFixed(4));
      s.style.setProperty('--mb68-opacity',opacity.toFixed(3));
    });
  }
  function request(){if(!ticking){ticking=true;requestAnimationFrame(render)}}
  addEventListener('scroll',request,{passive:true});
  addEventListener('resize',request,{passive:true});
  addEventListener('orientationchange',()=>setTimeout(request,80),{passive:true});
  request();
  addEventListener('load',()=>setTimeout(request,120),{once:true});
})();
</script>
