<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MediaBay® — Explore</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080909}
body{font-family:Arial,Helvetica,sans-serif;touch-action:none}
#viewport{position:fixed;inset:0;overflow:hidden;background:#080909;cursor:grab}
#viewport.dragging{cursor:grabbing}
#world{position:absolute;left:0;top:0;width:100vw;height:100vh;transform-origin:0 0;will-change:transform}
#world img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none;pointer-events:none}
#veil{position:absolute;inset:0;background:linear-gradient(180deg,#0004 0%,transparent 16%,transparent 82%,#0005 100%);pointer-events:none}
#brand{position:fixed;z-index:10;top:20px;left:24px;color:#fff;font-weight:900;letter-spacing:-.07em;font-size:20px;text-shadow:0 2px 14px #000;pointer-events:none}
#hint{position:fixed;z-index:10;left:50%;bottom:20px;transform:translateX(-50%);color:#fff;font-size:9px;letter-spacing:.18em;text-transform:uppercase;text-shadow:0 2px 12px #000;white-space:nowrap;pointer-events:none;opacity:.85}
.hot{position:absolute;z-index:5;transform:translate(-50%,-50%);border:0;background:none;padding:0;color:#fff;display:block;pointer-events:auto;cursor:pointer}
.pin{width:28px;height:28px;border:2px solid #d9ff45;border-radius:50%;background:#070707aa;display:grid;place-items:center;box-shadow:0 0 0 5px #d9ff4520,0 4px 20px #0008}
.pin:after{content:"";width:7px;height:7px;border-radius:50%;background:#d9ff45}
.caption{margin-top:8px;min-width:155px;text-align:left;padding:9px 11px;background:#050505dd;border:1px solid #fff4;backdrop-filter:blur(8px);text-shadow:none}
.caption strong{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.caption span{display:block;font-size:9px;color:#aaa;margin-top:4px}
#bike{left:14%;top:72%}#campaign{left:36%;top:55%}#digital{left:69%;top:50%}#ai{left:88%;top:54%}#origin{left:53%;top:27%}
#panel{position:fixed;z-index:20;right:24px;top:50%;transform:translateY(-50%) translateX(25px);width:min(370px,86vw);padding:28px;background:#070808ed;border:1px solid #fff3;color:#fff;box-shadow:0 30px 90px #000;opacity:0;visibility:hidden;transition:.3s;pointer-events:auto}
#panel.open{opacity:1;visibility:visible;transform:translateY(-50%)}
#close{float:right;border:0;background:none;color:#fff;font-size:24px}
.tag{font-size:9px;letter-spacing:.2em;color:#d9ff45;text-transform:uppercase}.title{font-size:38px;line-height:.9;letter-spacing:-.05em;margin:14px 0}.desc{font-size:13px;line-height:1.55;color:#bbb}
#loading{position:fixed;inset:0;background:#080909;z-index:30;display:grid;place-items:center;transition:opacity .6s}.loadingText{color:#fff;font-size:10px;letter-spacing:.24em;text-transform:uppercase}.line{height:1px;width:150px;background:#333;margin:17px auto}.line i{display:block;height:100%;width:0;background:#fff}
@media(max-width:700px){
 #brand{left:18px;top:17px;font-size:18px}.hot{transform:translate(-50%,-50%) scale(.78)}#hint{bottom:15px;font-size:7px}
 #panel{left:5vw;right:5vw;width:auto}.caption{min-width:150px}
}
</style>
</head>
<body>
<div id="viewport">
  <div id="world">
    <img src="cagliari-world.jpg" alt="">
    <div id="veil"></div>

    <!-- Hotspots are part of the interactive world and move with the image. -->
    <button class="hot" id="bike"><span class="pin"></span><span class="caption"><strong>MediaBike</strong><span>Street Media · Mobility</span></span></button>
    <button class="hot" id="campaign"><span class="pin"></span><span class="caption"><strong>Campaign Square</strong><span>Activation · Experiences</span></span></button>
    <button class="hot" id="digital"><span class="pin"></span><span class="caption"><strong>Digital District</strong><span>Web · Commerce · Growth</span></span></button>
    <button class="hot" id="ai"><span class="pin"></span><span class="caption"><strong>AI Lab</strong><span>Automation · Intelligence</span></span></button>
    <button class="hot" id="origin"><span class="pin"></span><span class="caption"><strong>Cagliari</strong><span>Our home · A global stage</span></span></button>
  </div>
</div>

<div id="brand">MEDIABAY®</div>
<div id="hint">Trascina per esplorare · Pinch per zoomare · Tocca un punto</div>

<div id="panel">
  <button id="close">×</button>
  <div class="tag" id="tag"></div>
  <div class="title" id="title"></div>
  <div class="desc" id="desc"></div>
</div>

<div id="loading"><div><div class="loadingText">Entering Cagliari</div><div class="line"><i id="bar"></i></div></div></div>

<script>
const viewport=document.getElementById('viewport'), world=document.getElementById('world');
const data={
 bike:['02 / REAL WORLD','MediaBike','Street media, mobility e attivazioni nel mondo reale, trasformate in contenuto e impatto digitale.'],
 campaign:['03 / MOVE','Phygital Campaigns','Il servizio flagship MediaBay: activation, guerrilla marketing, mobility e creatività connesse al digitale.'],
 digital:['01 / DIGITAL','Digital District','Web, commerce, content e digital experiences progettate per comunicare valore e convertire.'],
 ai:['04 / INTELLIGENCE','AI Lab','AI e automazione per rendere marketing e operazioni più semplici, intelligenti e scalabili.'],
 origin:['MEDIA BAY / ORIGIN','Cagliari','Il nostro punto di partenza: una città reale, mediterranea e aperta al mondo.']
};
const panel=document.getElementById('panel');
document.querySelectorAll('.hot').forEach(b=>b.addEventListener('click',e=>{
 e.stopPropagation(); const d=data[b.id];
 document.getElementById('tag').textContent=d[0];
 document.getElementById('title').textContent=d[1];
 document.getElementById('desc').textContent=d[2];
 panel.classList.add('open');
}));
document.getElementById('close').onclick=()=>panel.classList.remove('open');

// The image is a virtual world: drag pans it continuously; pinch/wheel zooms toward the gesture.
// On mobile, two-finger pinch works natively through Pointer Events.
let scale=1.0, tx=0, ty=0, targetScale=1, targetTx=0, targetTy=0;
let dragging=false,lastX=0,lastY=0;
let pointers=new Map(), pinchStartDist=0,pinchStartScale=1,pinchStartCenter={x:0,y:0};
const minScale=1,maxScale=3.2;

function bounds(s){
 const vw=innerWidth,vh=innerHeight;
 // image is 16:9 and fills the viewport with cover.
 const base=Math.max(vw/(16/9),vh);
 const w=base*(16/9),h=base;
 return {
  minX:vw-w*s, maxX:0,
  minY:vh-h*s, maxY:0
 };
}
function clamp(){
 const b=bounds(targetScale);
 targetTx=Math.max(b.minX,Math.min(b.maxX,targetTx));
 targetTy=Math.max(b.minY,Math.min(b.maxY,targetTy));
}
function render(){
 scale+=(targetScale-scale)*.16;
 tx+=(targetTx-tx)*.16;
 ty+=(targetTy-ty)*.16;
 const vw=innerWidth,vh=innerHeight;
 const base=Math.max(vw/(16/9),vh);
 const w=base*(16/9),h=base;
 world.style.width=w+'px';world.style.height=h+'px';
 world.style.transform=`translate3d(${tx}px,${ty}px,0) scale(${scale})`;
 requestAnimationFrame(render);
}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function center(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}
function zoomAt(factor,cx,cy){
 const old=targetScale,newScale=Math.max(minScale,Math.min(maxScale,old*factor));
 if(newScale===old)return;
 // Keep the point under the fingers/mouse stationary.
 targetTx=cx-(cx-targetTx)*(newScale/old);
 targetTy=cy-(cy-targetTy)*(newScale/old);
 targetScale=newScale;clamp();
}
viewport.addEventListener('pointerdown',e=>{
 if(e.target.closest('.hot,#panel'))return;
 pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pointers.size===1){dragging=true;lastX=e.clientX;lastY=e.clientY;viewport.classList.add('dragging')}
 if(pointers.size===2){
  const a=[...pointers.values()];pinchStartDist=dist(a[0],a[1]);pinchStartScale=targetScale;pinchStartCenter=center(a[0],a[1]);
 }
});
viewport.addEventListener('pointermove',e=>{
 if(!pointers.has(e.pointerId))return;
 pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pointers.size===2){
  const a=[...pointers.values()],d=dist(a[0],a[1]),c=center(a[0],a[1]);
  const ns=Math.max(minScale,Math.min(maxScale,pinchStartScale*(d/pinchStartDist)));
  targetTx=c.x-(pinchStartCenter.x-targetTx)*(ns/pinchStartScale);
  targetTy=c.y-(pinchStartCenter.y-targetTy)*(ns/pinchStartScale);
  targetScale=ns;clamp();
 }else if(pointers.size===1&&dragging){
  const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;
  targetTx+=dx;targetTy+=dy;clamp();
 }
});
function endPointer(e){
 pointers.delete(e.pointerId);
 if(pointers.size===0){dragging=false;viewport.classList.remove('dragging')}
}
viewport.addEventListener('pointerup',endPointer);viewport.addEventListener('pointercancel',endPointer);
viewport.addEventListener('wheel',e=>{
 e.preventDefault();zoomAt(Math.exp(-e.deltaY*.001),e.clientX,e.clientY);
},{passive:false});

function resize(){clamp()}
addEventListener('resize',resize);

for(let i=0;i<=100;i++)setTimeout(()=>document.getElementById('bar').style.width=i+'%',i*5);
setTimeout(()=>{const l=document.getElementById('loading');l.style.opacity=0;setTimeout(()=>l.remove(),700)},800);
render();
</script>
</body>
</html>
