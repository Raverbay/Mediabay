<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Scheda immobile in costruzione | Pronto Casa Facile</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f5f6f8;
      color: #172033;
      font-family: Arial, Helvetica, sans-serif;
    }

    .construction {
      width: 100%;
      max-width: 620px;
      padding: 48px 28px;
      text-align: center;
      background: #fff;
      border: 1px solid #e7e9ee;
      border-radius: 20px;
      box-shadow: 0 18px 55px rgba(20, 30, 50, .08);
    }

    .brand {
      margin-bottom: 42px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .symbol {
      display: grid;
      place-items: center;
      width: 76px;
      height: 76px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: #eef2f7;
      font-size: 34px;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: #64748b;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(28px, 6vw, 42px);
      line-height: 1.12;
    }

    .message {
      max-width: 430px;
      margin: 0 auto 30px;
      color: #647084;
      font-size: 16px;
      line-height: 1.7;
    }

    .back {
      display: inline-block;
      padding: 15px 24px;
      border-radius: 8px;
      background: #172033;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: opacity .2s ease;
    }

    .back:hover { opacity: .85; }

    .footer {
      margin-top: 34px;
      color: #8992a2;
      font-size: 12px;
    }
  </style>
  <link rel="stylesheet" href="assets/css/property-advisor.css">
</head>
<body>
  <main class="construction">
    <div class="brand">Pronto Casa Facile</div>

    <div class="symbol" aria-hidden="true">⌂</div>

    <p class="eyebrow">Stiamo lavorando per te</p>
    <h1>Scheda immobile in costruzione</h1>

    <p class="message">
      Stiamo preparando una nuova esperienza per scoprire questo immobile
      in ogni dettaglio. La scheda completa sarà disponibile prossimamente.
    </p>

    <a class="back" href="immobili.html">← Torna agli immobili</a>

    <div class="footer">Pronto Casa Facile · Esperienza digitale immobiliare</div>
  </main>
  <script src="assets/js/immobili.js"></script>
  <script src="assets/js/property-advisor-config.js"></script>
  <script src="assets/js/property-advisor.js"></script>
</body>
</html>
